<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Management</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="admin_home.html" class="brand-logo">Admin<span>Portal</span></a>
    <nav class="nav-links">
      <a href="admin_home.html">Home</a>
      <a href="product_management.html" class="active">Product Management</a>
      <a href="add_products.html">+ Add Product</a>
      <a href="view_all_products.html">Showcase</a>
    </nav>
  </header>

  <main class="main-wrapper">

    <!-- Update Section -->
    <section class="card-box">
      <h3>Update Product Details</h3>
      <form id="updateForm">
        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 1; min-width: 120px;">
            <label for="updateId">Target ID (Required):</label>
            <input type="number" id="updateId" placeholder="e.g. 1" required>
          </div>
          <div class="form-group" style="flex: 2; min-width: 200px;">
            <label for="updateName">Product Name:</label>
            <input type="text" id="updateName" placeholder="Updated name" required>
          </div>
          <div class="form-group" style="flex: 1; min-width: 140px;">
            <label for="updatePrice">Price (₹):</label>
            <input type="number" id="updatePrice" placeholder="Updated price" required>
          </div>
        </div>

        <div style="display: flex; gap: 12px; flex-wrap: wrap;">
          <div class="form-group" style="flex: 2; min-width: 200px;">
            <label for="updatePhotoUrl">Photo URL:</label>
            <input type="text" id="updatePhotoUrl" placeholder="Image URL" required>
          </div>
          <div class="form-group" style="flex: 3; min-width: 250px;">
            <label for="updateDescription">Description:</label>
            <input type="text" id="updateDescription" placeholder="Updated description" required>
          </div>
        </div>

        <button type="submit" class="btn-primary">Apply Update</button>
      </form>
    </section>

    <!-- Master Inventory Table -->
    <section class="card-box">
      <h3>Inventory Master Table</h3>
      
      <div class="search-container">
        <input type="text" id="filterInput" placeholder="Filter by product name...">
        <button type="button" class="btn-secondary" onclick="loadInventory()">Refresh Table</button>
      </div>

      <table class="product-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Image</th>
            <th>Name</th>
            <th>Price</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
          <!-- Populated from GET http://localhost:8083/all -->
        </tbody>
      </table>
    </section>

  </main>

  <script>
    const API_BASE = "http://localhost:8083";
    let inventory = [];

    // Fetch and populate table
    async function loadInventory() {
      try {
        const response = await fetch(`${API_BASE}/all`);
        inventory = await response.json();
        renderTable(inventory);
      } catch (err) {
        console.error("Error loading products:", err);
      }
    }

    function renderTable(items) {
      const tbody = document.getElementById("inventoryTableBody");
      tbody.innerHTML = "";

      if (!items || items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #555;">No products in database.</td></tr>`;
        return;
      }

      items.forEach(p => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${p.id}</td>
          <td><img src="${p.photoUrl}" class="table-img" onerror="this.src='https://via.placeholder.com/45?text=NA'"></td>
          <td>${p.name}</td>
          <td>₹${p.price}</td>
          <td>${p.description}</td>
          <td>
            <button class="btn-edit" onclick="populateUpdateForm(${p.id})">Edit</button>
            <button class="btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Populate top update form when clicking Edit on a table row
    function populateUpdateForm(id) {
      const item = inventory.find(p => p.id === id);
      if (item) {
        document.getElementById("updateId").value = item.id;
        document.getElementById("updateName").value = item.name;
        document.getElementById("updatePrice").value = item.price;
        document.getElementById("updatePhotoUrl").value = item.photoUrl;
        document.getElementById("updateDescription").value = item.description;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    // Send PUT request to Spring Boot: /update/{id}
    document.getElementById("updateForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const id = document.getElementById("updateId").value;
      const payload = {
        name: document.getElementById("updateName").value,
        price: parseInt(document.getElementById("updatePrice").value, 10),
        photoUrl: document.getElementById("updatePhotoUrl").value,
        description: document.getElementById("updateDescription").value
      };

      try {
        const response = await fetch(`${API_BASE}/update/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (response.ok) {
          alert("Product updated successfully!");
          document.getElementById("updateForm").reset();
          loadInventory();
        } else {
          alert("Failed to update product.");
        }
      } catch (err) {
        alert("Server unreachable. Check if Spring Boot is running.");
      }
    });

    // Send DELETE request to Spring Boot: /delete/{id}
    async function deleteProduct(id) {
      if (!confirm(`Are you sure you want to delete Product ID: ${id}?`)) return;

      try {
        const response = await fetch(`${API_BASE}/delete/${id}`, {
          method: "DELETE"
        });
        if (response.ok) {
          alert("Product deleted!");
          loadInventory();
        } else {
          alert("Failed to delete product.");
        }
      } catch (err) {
        alert("Server unreachable.");
      }
    }

    // Local table search
    document.getElementById("filterInput").addEventListener("keyup", (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = inventory.filter(p => p.name.toLowerCase().includes(query));
      renderTable(filtered);
    });

    // Run on page load
    loadInventory();
  </script>
</body>
</html>
