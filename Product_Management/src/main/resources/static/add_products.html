<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Product</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="navbar">
    <a href="admin_home.html" class="brand-logo">Admin<span>Portal</span></a>
    <nav class="nav-links">
      <a href="admin_home.html">Home</a>
      <a href="product_management.html">Product Management</a>
      <a href="add_products.html" class="active">+ Add Product</a>
      <a href="view_all_products.html">Showcase</a>
    </nav>
  </header>

  <main class="main-wrapper" style="max-width: 650px;">
    <section class="card-box">
      <h2>Add New Product</h2>
      <p style="font-size: 13px; color: #555; margin-bottom: 16px;">
        Values will map directly to the <code>Products</code> entity in Spring Boot.
      </p>

      <form id="addProductForm">
        <div class="form-group">
          <label for="name">Product Name (Unique)</label>
          <input type="text" id="name" placeholder="e.g. Mechanical Keyboard" required>
        </div>

        <div class="form-group">
          <label for="price">Price (₹)</label>
          <input type="number" id="price" placeholder="e.g. 7499" min="0" required>
        </div>

        <div class="form-group">
          <label for="photoUrl">Photo URL</label>
          <input type="text" id="photoUrl" placeholder="https://images.unsplash.com/..." required>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="4" placeholder="Mention product details..." required></textarea>
        </div>

        <div style="display: flex; gap: 12px; margin-top: 16px;">
          <button type="submit" class="btn-primary">Save Product</button>
          <a href="product_management.html" class="btn-secondary">Cancel</a>
        </div>
      </form>
    </section>
  </main>

  <script>
    const API_BASE = "http://localhost:8083";

    document.getElementById("addProductForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      // Maps directly to Products.java fields
      const payload = {
        name: document.getElementById("name").value.trim(),
        price: parseInt(document.getElementById("price").value, 10),
        photoUrl: document.getElementById("photoUrl").value.trim(),
        description: document.getElementById("description").value.trim()
      };

      try {
        const response = await fetch(`${API_BASE}/create`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          alert("Product added successfully to MySQL!");
          window.location.href = "view_all_products.html";
        } else {
          const errData = await response.json().catch(() => ({}));
          alert("Failed to save product: " + (errData.error || "Check backend console"));
        }
      } catch (err) {
        alert("Server unreachable. Check if Spring Boot is running on port 8083.");
      }
    });
  </script>
</body>
</html>
